name: Application Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 8 * * 3'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-security:
    name: WordPress security checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate latest stable PHP compatibility
        uses: ./.github/actions/php-compatibility

      - name: Install security-analysis dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run WordPress security checks
        env:
          RUN_SEMGREP: '0'
        run: ./scripts/security-check.sh

  semgrep:
    name: Semgrep CE SAST
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Resolve and run latest stable Semgrep CE
        run: ./scripts/semgrep-check.sh

      - name: Preserve scanner and rule provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-provenance
          if-no-files-found: error
          path: |
            reports/semgrep/manifest.json
            reports/semgrep/summary.json
            reports/semgrep/wordpress-adaptation.json

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history and current working tree with free Gitleaks CLI
        run: python3 scripts/gitleaks-check.py

      - name: Preserve Gitleaks provenance without findings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-provenance
          if-no-files-found: error
          path: reports/gitleaks/manifest.json
