name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate latest stable PHP compatibility
        uses: ./.github/actions/php-compatibility

      - name: Resolve repository version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' src/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.php | head -n 1)"
          test -n "${version}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate and build release package
        run: make release VERSION="${{ steps.version.outputs.value }}"
