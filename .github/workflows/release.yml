name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-gates:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  integration-gates:
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  release:
    needs: [security-gates, integration-gates]
    permissions:
      contents: read
      actions: read
    name: Validate and Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      archive_sha256: ${{ steps.receipt.outputs.archive_sha256 }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}

    env:
      RELEASE_ZIP: dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate latest stable PHP compatibility
        uses: ./.github/actions/php-compatibility

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${version}"
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/tags/v${version}" ]]; then
            echo "Publication requires the existing matching release tag context."
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit differs from the release event."
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate and build release package
        run: make release VERSION="${{ steps.version.outputs.value }}"

      - name: Install security-analysis dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate release security
        env:
          RUN_SEMGREP: '0'
        run: ./scripts/security-check.sh

      - name: Validate disposable WordPress compatibility before publication
        run: ./scripts/integration-test-ci.sh

      - name: Require all release evidence and atomic fencing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_readiness.py

      - name: Bind validated candidate to trusted producer outputs
        id: receipt
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          receipt_sha="$(python3 scripts/release_artifact.py create --archive "$RELEASE_ZIP" --receipt dist/release-receipt.json --commit "$GITHUB_SHA" --version "$RELEASE_VERSION")"
          archive_sha="$(sha256sum "$RELEASE_ZIP" | cut -d ' ' -f 1)"
          echo "receipt_sha256=$receipt_sha" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        run: sha256sum "${RELEASE_ZIP}" > "${RELEASE_ZIP}.sha256"

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip
            dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip.sha256
            dist/release-receipt.json

  publish:
    name: Publish validated release
    needs: [security-gates, integration-gates, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-release
          path: dist

      - name: Verify downloaded checksum
        run: sha256sum --check dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip.sha256

      - name: Verify independent producer identity before publication
        env:
          EXPECTED_ARCHIVE_SHA: ${{ needs.release.outputs.archive_sha256 }}
          EXPECTED_RECEIPT_SHA: ${{ needs.release.outputs.receipt_sha256 }}
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, re
          def read(path):
              with pathlib.Path(path).open('rb') as stream:
                  data = stream.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024:
                  raise SystemExit('Artifact exceeds publication bounds')
              return data
          for key in ['EXPECTED_ARCHIVE_SHA', 'EXPECTED_RECEIPT_SHA']:
              if not re.fullmatch(r'[0-9a-f]{64}', os.environ[key]):
                  raise SystemExit('Missing trusted producer digest')
          archive = read('dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip')
          receipt = read('dist/release-receipt.json')
          if hashlib.sha256(archive).hexdigest() != os.environ['EXPECTED_ARCHIVE_SHA'] or hashlib.sha256(receipt).hexdigest() != os.environ['EXPECTED_RECEIPT_SHA']:
              raise SystemExit('Downloaded artifact differs from independently validated producer')
          record = json.loads(receipt)
          if record.get('commit') != os.environ['EXPECTED_COMMIT'] or record.get('version') != os.environ['EXPECTED_VERSION'] or record.get('tag') != 'v' + os.environ['EXPECTED_VERSION'] or record.get('archive_sha256') != os.environ['EXPECTED_ARCHIVE_SHA']:
              raise SystemExit('Producer receipt identity mismatch')
          PYTHON

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Grey Rock Block Synchroniser for Wordfence and Cloudflare ${{ needs.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip
            dist/grey-rock-block-synchroniser-for-wordfence-and-cloudflare.zip.sha256
            dist/release-receipt.json
